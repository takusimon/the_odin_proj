<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Function Practice</title>
    </head>
    <body>
        <script>
            function add7 (number){
                return number + 7;
            }

            function multiplyNumber(num1,num2) {
                return num1 * num2;
            }

            function capitalizeWord(word){
                return word.at(0).toUpperCase() + word.slice(1,).toLowerCase();
            }

            function getLastLetter(word){
                return word.at(-1);
            }

            console.log(add7(10));
            console.log(multiplyNumber(5,7));
            console.log(capitalizeWord("abcd"));
            console.log(getLastLetter("Takudzwanashe"));
        </script>
    </body>
</html>
